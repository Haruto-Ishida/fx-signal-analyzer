# FXシグナル分析ツールの設定（ユーザーが変えてよい数値）
# 値を変えたら、画面を再読み込みしてください。書き方を間違えた場合は初期値が使われ、画面に注意が出ます。

[paper]
# ペーパートレード（仮想のお金での口座全体のシミュレーション）の初期残高（円）
initial_balance = 100000
# 毎月の追加入金（円）。積立のシミュレーション用。運用成績（時間加重リターン）からは入金の影響を除きます
monthly_deposit = 0

[sizing]
# ケリー基準の何分の1を使うか（0.25 = 4分の1ケリー。上限は 0.5）
kelly_fraction = 0.25
# 取引が少ない（100回未満）ときに使う、1回の損失の上限（残高に対する%）
fixed_risk_pct = 1.0
# ケリーの結果にかかわらず、1回の取引で失ってよい額の上限（残高に対する%）
max_risk_pct = 2.0
# 実効レバレッジ（持っているポジションの合計 ÷ 残高）の上限。国内規制の25倍より十分低く
max_leverage = 5.0

[kill_switch]
# どれか1つに達したら、その期間は新しいシグナルを止める（画面から手動で解除もできる）
max_consecutive_losses = 5      # 連敗の回数
max_signals_per_day = 10        # 1日（日本時間）の新しいシグナルの回数
daily_loss_pct = 3.0            # 1日の損失（ペーパー口座の残高に対する%）
weekly_loss_pct = 6.0           # 1週間（月曜から）の損失（同上）

[event_filter]
# 重要な経済指標（米雇用統計・FOMC・日銀会合）の前後、新しいシグナルを止める時間（分）
minutes_before = 60
minutes_after = 60
# 発表時刻が決まっていない予定（日銀会合）は、正午ごろの前後この時間（分）止める
unfixed_window_minutes = 180

[costs]
# 取引コストを広めに見積もる時間帯での、スプレッドの倍率
event_spread_multiplier = 3.0       # 重要な経済指標の前後
weekend_open_spread_multiplier = 3.0  # 週明け（月曜の最初の数時間）
rollover_spread_multiplier = 2.0    # ロールオーバーの時間帯（NY市場の終わり）

[trial_budget]
# 試す数の目安（研究ノート：試すほど偶然よく見えるものが見つかりやすい）
ga_full_search = 500     # 本格的なGA探索 1回あたり
ga_weekly_search = 100   # 週末の再探索 1回あたり（前回の上位候補の周辺だけ）
